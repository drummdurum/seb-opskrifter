services:
  mongodb:
    image: mongo:7
    container_name: opskrifter-test-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - opskrifter_test_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  opskrifter_test_data:
